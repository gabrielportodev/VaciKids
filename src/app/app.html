<div class="min-h-dvh md:flex">
  <aside class="sticky top-0 hidden h-dvh w-60 shrink-0 flex-col gap-1 bg-brand-brown p-4 md:flex">
    <a routerLink="/dashboard" class="mb-4 flex items-center gap-2 px-2 py-2">
      <span
        class="flex h-9 w-9 items-center justify-center rounded-xl bg-brand-green text-brand-brown"
      >
        <app-icon name="shield-check" [size]="22" />
      </span>
      <span class="text-lg font-extrabold text-white">VaciKids</span>
    </a>

    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-white/10 !text-white"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-semibold text-white/60 transition hover:bg-white/5 hover:text-white"
      >
        <app-icon [name]="item.icon" [size]="22" />
        {{ item.label }}
      </a>
    }
  </aside>

  <main class="flex-1 pb-24 md:pb-0">
    <div class="mx-auto w-full max-w-300 px-4 py-5 md:px-8 md:py-8">
      <router-outlet />
    </div>
  </main>

  <nav
    class="fixed inset-x-0 bottom-0 z-30 flex border-t border-brand-brown/10 bg-card/95 backdrop-blur-sm md:hidden"
  >
    @for (tab of tabs; track tab.path) {
      <a
        [routerLink]="tab.path"
        routerLinkActive="!text-brand-green"
        class="flex flex-1 flex-col items-center gap-1 py-2.5 text-[0.7rem] font-semibold text-muted transition"
      >
        <app-icon [name]="tab.icon" [size]="24" />
        {{ tab.label }}
      </a>
    }
  </nav>
</div>
