@if (mobileMenuOpen()) {
  <div
    class="vk-overlay fixed inset-0 z-40 bg-brand-brown/50 md:hidden"
    role="presentation"
    (click)="closeMobileMenu()"
  ></div>
}

<div class="min-h-dvh md:flex">
  <aside
    class="fixed inset-y-0 left-0 z-50 flex h-dvh w-64 flex-col gap-1 overflow-hidden bg-brand-brown p-3 transition-[transform,width] duration-300 md:sticky md:top-0 md:z-0 md:shrink-0"
    [class]="asideClasses()"
  >
    <div class="flex items-center gap-2 px-1 py-2" [class.justify-center]="iconOnly()">
      <a routerLink="/dashboard" class="flex items-center gap-2" (click)="closeMobileMenu()">
        <span
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-brand-green text-brand-brown"
        >
          <ion-icon name="shield-check" style="font-size: 22px" />
        </span>
        @if (showLabels()) {
          <span class="text-lg font-extrabold text-white">VaciKids</span>
        }
      </a>
    </div>

    @if (showNav()) {
      <div class="flex flex-1 flex-col gap-1 overflow-y-auto scrollbar-none">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-white/10 !text-white"
            (click)="closeMobileMenu()"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-semibold text-white/60 transition hover:bg-white/5 hover:text-white"
            [class.justify-center]="iconOnly()"
          >
            <ion-icon [name]="item.icon" style="font-size: 22px" />
            @if (showLabels()) {
              {{ item.label }}
            }
          </a>
        }
      </div>

      <div class="hidden border-t border-white/10 pt-2 md:block">
        <button
          type="button"
          (click)="toggleCollapse()"
          aria-label="Recolher ou expandir menu"
          class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-semibold text-white/60 transition hover:bg-white/5 hover:text-white"
          [class.justify-center]="iconOnly()"
        >
          <ion-icon
            name="chevrons-left"
            style="font-size: 18px"
            class="shrink-0 transition-transform"
            [class.rotate-180]="iconOnly()"
          />
          @if (showLabels()) {
            <span>Recolher</span>
          }
        </button>
      </div>
    } @else {
      <button
        type="button"
        (click)="openSidebar()"
        aria-label="Abrir menu"
        class="flex h-9 w-9 items-center justify-center rounded-lg text-white/60 transition hover:bg-white/5 hover:text-white"
      >
        <ion-icon name="menu" style="font-size: 20px" />
      </button>
    }
  </aside>

  <div class="flex min-h-dvh min-w-0 flex-1 flex-col">
    <header
      class="sticky top-0 z-30 flex items-center gap-3 border-b border-brand-brown/10 bg-card/95 px-4 py-3 backdrop-blur-sm md:hidden"
    >
      <button
        type="button"
        (click)="openMobileMenu()"
        aria-label="Abrir menu"
        class="flex h-9 w-9 items-center justify-center rounded-lg text-brand-brown transition hover:bg-brand-brown/5"
      >
        <ion-icon name="menu" style="font-size: 22px" />
      </button>
      <a routerLink="/dashboard" class="flex items-center gap-2">
        <span
          class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand-green text-brand-brown"
        >
          <ion-icon name="shield-check" style="font-size: 18px" />
        </span>
        <span class="font-extrabold text-brand-brown">VaciKids</span>
      </a>
    </header>

    <main class="min-w-0 flex-1">
      <div class="mx-auto w-full max-w-300 min-w-0 px-4 py-5 md:px-8 md:py-8">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
