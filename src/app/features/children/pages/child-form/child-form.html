<app-detail-header
  [title]="isEdit() ? 'Editar criança' : 'Nova criança'"
  [backLink]="isEdit() ? '/children/' + id() : '/children'"
/>

<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
  <div class="flex flex-col items-center gap-2">
    <label class="group relative cursor-pointer">
      <span
        class="flex h-24 w-24 items-center justify-center overflow-hidden rounded-full bg-brand-green/20 text-2xl font-extrabold text-brand-brown"
      >
        @if (photoPreview()) {
          <img [src]="photoPreview()" alt="Foto da criança" class="h-full w-full object-cover" />
        } @else if (initials()) {
          {{ initials() }}
        } @else {
          <ion-icon name="camera" style="font-size: 28px" class="text-brand-brown/50" />
        }
      </span>
      <span
        class="absolute right-0 bottom-0 flex h-8 w-8 items-center justify-center rounded-full border-2 border-surface bg-brand-green text-brand-brown"
      >
        <ion-icon name="camera" style="font-size: 16px" />
      </span>
      <input type="file" accept="image/*" class="sr-only" (change)="onPhotoSelected($event)" />
    </label>
    <span class="text-xs text-muted">Adicionar foto (opcional)</span>
  </div>

  <label class="block space-y-1.5">
    <span class="text-sm font-bold text-brand-brown">Nome completo</span>
    <input
      type="text"
      formControlName="name"
      placeholder="Ex.: Helena Souza"
      class="h-11 w-full rounded-lg border border-brand-brown/15 bg-card px-3 text-brand-brown outline-none transition placeholder:text-muted focus:border-brand-green focus:ring-2 focus:ring-brand-green/40"
    />
    @if (form.controls.name.touched && form.controls.name.invalid) {
      <span class="text-xs font-semibold text-brand-orange">Informe um nome válido.</span>
    }
  </label>

  <label class="block space-y-1.5">
    <span class="text-sm font-bold text-brand-brown">Data de nascimento</span>
    <input
      type="date"
      formControlName="birthDate"
      [max]="maxDate"
      class="h-11 w-full rounded-lg border border-brand-brown/15 bg-card px-3 text-brand-brown outline-none transition focus:border-brand-green focus:ring-2 focus:ring-brand-green/40"
    />
    @if (form.controls.birthDate.touched && form.controls.birthDate.invalid) {
      <span class="text-xs font-semibold text-brand-orange">
        @if (form.controls.birthDate.hasError('futureDate')) {
          A data de nascimento não pode ser no futuro.
        } @else {
          Informe a data de nascimento.
        }
      </span>
    }
  </label>

  <div class="space-y-1.5">
    <span class="text-sm font-bold text-brand-brown">Sexo</span>
    <div class="flex gap-1 rounded-lg bg-brand-brown/5 p-1">
      <button
        type="button"
        (click)="setGender('male')"
        class="h-10 flex-1 rounded-md text-sm font-bold transition"
        [class]="
          form.controls.gender.value === 'male'
            ? 'bg-card text-brand-brown shadow-soft'
            : 'text-muted'
        "
      >
        Masculino
      </button>
      <button
        type="button"
        (click)="setGender('female')"
        class="h-10 flex-1 rounded-md text-sm font-bold transition"
        [class]="
          form.controls.gender.value === 'female'
            ? 'bg-card text-brand-brown shadow-soft'
            : 'text-muted'
        "
      >
        Feminino
      </button>
    </div>
  </div>

  <div class="space-y-3 pt-2">
    <button
      type="submit"
      [disabled]="form.invalid || submitting()"
      class="flex h-12 w-full items-center justify-center rounded-lg bg-brand-green font-bold text-brand-brown transition hover:brightness-95 disabled:cursor-not-allowed disabled:opacity-50"
    >
      @if (submitting()) {
        <app-loading inline [label]="isEdit() ? 'Salvando…' : 'Cadastrando…'" />
      } @else {
        {{ isEdit() ? 'Salvar' : 'Cadastrar' }}
      }
    </button>

    @if (isEdit()) {
      <button
        type="button"
        (click)="remove()"
        [disabled]="deleting()"
        class="flex h-11 w-full items-center justify-center gap-2 rounded-lg text-sm font-bold text-red-600 transition hover:bg-red-50 disabled:opacity-50"
      >
        @if (deleting()) {
          <app-loading inline label="Excluindo…" />
        } @else {
          <ion-icon name="trash" style="font-size: 18px" />
          Excluir criança
        }
      </button>
    }
  </div>
</form>
