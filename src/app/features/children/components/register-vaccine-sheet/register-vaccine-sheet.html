<div
  class="vk-overlay fixed inset-0 z-40 flex items-end justify-center bg-brand-brown/40 sm:items-center"
  role="button"
  tabindex="0"
  aria-label="Fechar"
  (click)="onBackdrop($event)"
  (keydown.escape)="cancelled.emit()"
>
  <div class="vk-sheet w-full max-w-md rounded-t-2xl bg-surface p-5 shadow-pop sm:rounded-2xl">
    <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-brand-brown/15 sm:hidden"></div>

    <div class="mb-4 flex items-start justify-between gap-3">
      <div>
        <h2 class="text-lg font-extrabold text-brand-brown">Registrar vacina</h2>
        <p class="text-sm text-muted">{{ vaccineName() }} · {{ record().dose }}ª dose</p>
      </div>
      <button
        type="button"
        aria-label="Fechar"
        (click)="cancelled.emit()"
        class="flex h-9 w-9 items-center justify-center rounded-full text-muted transition hover:bg-brand-brown/5"
      >
        <app-icon name="x" [size]="20" />
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="confirm()" class="space-y-4">
      <label class="block space-y-1.5">
        <span class="text-sm font-bold text-brand-brown">Data de aplicação</span>
        <input
          type="date"
          formControlName="applicationDate"
          class="h-11 w-full rounded-lg border border-brand-brown/15 bg-card px-3 text-brand-brown outline-none focus:border-brand-green focus:ring-2 focus:ring-brand-green/40"
        />
      </label>

      <label class="block space-y-1.5">
        <span class="flex items-center gap-1.5 text-sm font-bold text-brand-brown">
          <app-icon name="map-pin" [size]="16" class="text-muted" />
          Local de aplicação
          <span class="font-normal text-muted">(opcional)</span>
        </span>
        <input
          type="text"
          formControlName="healthUnit"
          placeholder="Ex.: UBS Central"
          class="h-11 w-full rounded-lg border border-brand-brown/15 bg-card px-3 text-brand-brown outline-none placeholder:text-muted focus:border-brand-green focus:ring-2 focus:ring-brand-green/40"
        />
      </label>

      <label class="block space-y-1.5">
        <span class="flex items-center gap-1.5 text-sm font-bold text-brand-brown">
          <app-icon name="package" [size]="16" class="text-muted" />
          Lote da vacina
          <span class="font-normal text-muted">(opcional)</span>
        </span>
        <input
          type="text"
          formControlName="batch"
          placeholder="Ex.: ABC-1234"
          class="h-11 w-full rounded-lg border border-brand-brown/15 bg-card px-3 text-brand-brown outline-none placeholder:text-muted focus:border-brand-green focus:ring-2 focus:ring-brand-green/40"
        />
      </label>

      <div class="space-y-2 pt-1">
        <button
          type="submit"
          class="h-12 w-full rounded-lg bg-brand-green font-bold text-brand-brown transition hover:brightness-95"
        >
          Confirmar
        </button>
        <button
          type="button"
          (click)="cancelled.emit()"
          class="h-11 w-full rounded-lg text-sm font-bold text-muted transition hover:bg-brand-brown/5"
        >
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
