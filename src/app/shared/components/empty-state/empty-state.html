<ion-card class="w-full rounded-xl border border-dashed border-brand-brown/15 bg-card/50">
  <ion-card-content class="px-6 py-10">
    <div class="flex w-full flex-col items-center justify-center gap-3 text-center">
      <span
        class="flex h-16 w-16 items-center justify-center rounded-full bg-brand-green/15 text-brand-green"
      >
        <ion-icon [name]="icon()" style="font-size: 30px" />
      </span>
      <p class="text-base font-bold text-brand-brown">{{ title() }}</p>
      @if (description()) {
        <p class="max-w-xs text-sm text-muted">{{ description() }}</p>
      }
      <ng-content />
    </div>
  </ion-card-content>
</ion-card>
