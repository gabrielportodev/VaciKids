<ion-card
  [routerLink]="['/children', child().id]"
  button
  class="rounded-xl bg-card shadow-soft transition hover:-translate-y-0.5 hover:shadow-card"
>
  <ion-card-content class="p-4">
    <div class="flex items-center gap-3">
      @if (child().photoUrl) {
        <ion-avatar class="h-12 w-12 shrink-0">
          <img [src]="child().photoUrl" [alt]="child().name" />
        </ion-avatar>
      } @else {
        <span
          class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-brand-green/25 text-base font-extrabold text-brand-brown"
        >
          {{ initials() }}
        </span>
      }

      <div class="min-w-0 flex-1">
        <strong class="block truncate text-brand-brown">{{ child().name }}</strong>
        <p class="truncate text-sm text-muted">{{ child().birthDate | age }}</p>
      </div>

      <ion-icon name="chevron-right" style="font-size: 20px" class="text-muted" />
    </div>

    <div class="mt-4">
      <div class="flex h-2 overflow-hidden rounded-full bg-brand-brown/10">
        <span class="h-full bg-brand-green" [style.width.%]="summary().appliedPercent"></span>
        <span class="h-full bg-brand-orange" [style.width.%]="summary().overduePercent"></span>
      </div>
      <div class="mt-2 flex items-center justify-between text-xs">
        <span class="font-semibold text-brand-brown">
          {{ summary().applied }}/{{ summary().total }} em dia
        </span>
        @if (summary().overdue > 0) {
          <span class="font-semibold text-brand-orange"> {{ summary().overdue }} atrasada(s) </span>
        } @else {
          <span class="text-muted">Tudo certo</span>
        }
      </div>
    </div>
  </ion-card-content>
</ion-card>
