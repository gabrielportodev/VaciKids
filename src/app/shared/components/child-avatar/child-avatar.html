<span
  class="flex shrink-0 items-center justify-center overflow-hidden rounded-full bg-brand-green/25 font-extrabold text-brand-brown"
  [class]="sizeClasses()"
>
  @if (photoUrl()) {
    <img [src]="photoUrl()" [alt]="name()" class="h-full w-full object-cover" />
  } @else {
    {{ initials() }}
  }
</span>
